<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">BridgeLab mark</title>
  <desc id="desc">BridgeLab wordmark on a deep-sea panel with three glowing bridge bars.</desc>
  <defs>
    <linearGradient id="abyss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1c30"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d6d0"/>
      <stop offset="1" stop-color="#7ff0ea"/>
    </linearGradient>
  </defs>
  <rect width="720" height="220" fill="url(#abyss)"/>
  <g transform="translate(44 52)">
